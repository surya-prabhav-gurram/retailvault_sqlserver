spring.application.name=retailvault-backend
server.port=8080

# ============================================================
# SQL Server - OLTP
# ============================================================
spring.datasource.oltp.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=RetailVault_OLTP;encrypt=false;trustServerCertificate=true;loginTimeout=30
spring.datasource.oltp.username=sa
spring.datasource.oltp.password=YourStrong!Passw0rd
spring.datasource.oltp.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================================
# SQL Server - Data Warehouse
# ============================================================
spring.datasource.warehouse.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=RetailVault_Warehouse;encrypt=false;trustServerCertificate=true;loginTimeout=30
spring.datasource.warehouse.username=sa
spring.datasource.warehouse.password=YourStrong!Passw0rd
spring.datasource.warehouse.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================================
# JPA / Hibernate - SQL Server dialect
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============================================================
# Spring Batch - point it explicitly at the OLTP datasource
# and tell it the platform is sqlserver
# ============================================================
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.platform=sqlserver

# ============================================================
# ETL Schedule
# ============================================================
etl.schedule.cron=0 0 2 * * *
etl.schedule.enabled=true

# ============================================================
# CORS
# ============================================================
cors.allowed-origins=http://localhost:3000

# ============================================================
# Logging
# ============================================================
logging.level.com.retailvault=INFO
logging.level.org.springframework.batch=INFO

cors.allowed-origins=https://invigorating-inspiration-production-578b.up.railway.app
